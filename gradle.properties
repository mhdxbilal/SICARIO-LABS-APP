# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# JVM Arguments for Gradle Daemon
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

# Parallel Builds
org.gradle.parallel=true

# Kotlin Code Style
kotlin.code.style=official

# R Class Namespacing
android.nonTransitiveRClass=true

# Gradle Optimization
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.workers.max=4

# Kotlin Compiler
kotlin.compiler.execution.strategy=in-process

# ============================================
# OFFLINE-FIRST APPLICATION CONFIGURATION
# ============================================

# Feature Flags
FEATURE_OFFLINE_MODE_ONLY=true
FEATURE_LOCAL_CACHE_ONLY=true
FEATURE_NO_ANALYTICS=true
FEATURE_NO_TRACKING=true
FEATURE_NO_ADS=true

# Application Settings
APP_NAME=SICARIO LABS - Media Player
APP_VERSION_CODE=2
APP_VERSION_NAME=2.0.0
APP_PACKAGE=com.siciario.labs.mediaplayer

# Database
DB_NAME=sicario_media_player.db
DB_VERSION=1

# Cache Settings (Offline)
CACHE_THUMBNAIL_SIZE=256
CACHE_METADATA_EXPIRY_DAYS=30
CACHE_MAX_SIZE_MB=500

# Media Scanning
MEDIA_SCAN_INTERVAL_HOURS=24
MEDIA_FORMATS_AUDIO=mp3,wav,flac,aac,ogg,m4a,wma
MEDIA_FORMATS_VIDEO=mp4,mkv,webm,avi,3gp,flv

# Performance
PLAYBACK_BUFFER_MS=1000
PLAYBACK_CACHE_SIZE_MB=100

# Security (No Internet)
SECURE_NO_NETWORK_CALLS=true
VERIFY_OFFLINE_MODE_ON_STARTUP=true
