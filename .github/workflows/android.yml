name: Android CI/CD Performance Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  audit-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle Runner
      uses: gradle/actions/setup-gradle@v4

    - name: Grant Execute Permission to Gradlew
      run: chmod +x ./gradlew || true

    - name: Pre-generate Android Debug Keystore
      run: |
        mkdir -p ~/.android
        keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"

    - name: Execute Code Health Check
      run: |
        chmod +x ./scripts/code_health_check.sh
        touch ./gradlew
        ./scripts/code_health_check.sh

    - name: Validate Compose Hardware Acceleration
      run: |
        chmod +x ./scripts/compose_hardware_accel.sh
        ./scripts/compose_hardware_accel.sh

    - name: Run Bloat Audit & Eliminate Bloat
      run: |
        chmod +x ./scripts/bloat_eliminator.sh
        ./scripts/bloat_eliminator.sh

    - name: Upload Verified Performance APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: optimized-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
